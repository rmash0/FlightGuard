<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
    />
    <script>
      // Set the theme before first paint so there's no light/dark flash. Key matches ThemeToggle.
      (function () {
        var theme = 'light';
        var themes = ['light', 'dark', 'aquarium'];
        try {
          // ?theme=aquarium in the URL picks (and remembers) a theme, handy for demo links.
          var requested = new URLSearchParams(window.location.search).get('theme');
          if (themes.indexOf(requested) !== -1) {
            localStorage.setItem('theme', requested);
          }
          var saved = localStorage.getItem('theme');
          if (themes.indexOf(saved) !== -1) {
            theme = saved;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
